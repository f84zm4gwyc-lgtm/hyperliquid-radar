name: Actualiser radar Hyperliquid BTC ETH
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hyperliquid-radar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r hyperliquid-radar/requirements.txt
      - name: Collect and analyze BTC ETH
        run: python hyperliquid-radar/radar.py
      - name: Publish public reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hyperliquid-radar/docs/report.md hyperliquid-radar/docs/latest.json hyperliquid-radar/docs/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update BTC ETH market data'
            git push
          fi
