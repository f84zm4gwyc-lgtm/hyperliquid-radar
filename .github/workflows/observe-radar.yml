name: Radar observation audit (READ-ONLY, no orders)
on:
  schedule:
    # Desired every ten minutes. GitHub Action scheduling IS NOT guaranteed.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observation-archive-single-writer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline archive safeguards
        run: python -m unittest discover -s radar-audit -p 'test_*.py' -q
      - name: Observe public Render status and candidates (no exchange account)
        run: python radar-audit/capture_public.py
      - name: Archive public WATCH_ONLY candidates into V4 journal (never trade)
        run: |
          python paper-trading-v4/import_watch_only.py
          python paper-trading-v4/journal.py verify --journal paper-trading-v4/data/watch_only_journal.jsonl || test ! -e paper-trading-v4/data/watch_only_journal.jsonl
      - name: Summarize observation gaps (never claim continuous uptime)
        run: python radar-audit/report.py
      - name: Commit observation to public repository (unverified samples)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-audit/data/
          if [ -d paper-trading-v4/data ]; then git add paper-trading-v4/data/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive public radar observation (not paper PnL)'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo 'Archive push failed: no reliable persisted observation on this run' >&2
          exit 1
